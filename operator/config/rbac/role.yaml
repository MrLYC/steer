  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - steer.io
  resources:
  - helmreleases/finalizers
  verbs:
  - update
- apiGroups:
  - steer.io
  resources:
  - helmreleases/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - steer.io
  resources:
  - helmtestjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - steer.io
  resources:
  - helmtestjobs/finalizers
  verbs:
  - update
- apiGroups:
  - steer.io
  resources:
  - helmtestjobs/status
  verbs:
  - get
  - patch
  - update
