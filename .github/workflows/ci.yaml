name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  helm-lint-template:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Kyverno Helm repo
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build charts/steer

      - name: Helm lint
        run: helm lint charts/steer

      - name: Helm template (default values)
        run: helm template steer charts/steer -n steer --dependency-update

      - name: Helm template (with kyverno enabled)
        run: helm template steer charts/steer -n steer --dependency-update -f examples/values-with-kyverno.yaml

      - name: Helm template (custom values)
        run: helm template steer charts/steer -n steer --dependency-update -f examples/values-custom.yaml

  kind-helm-test:
    name: kind + helm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: steer

      - name: Add Kyverno Helm repo
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build charts/steer

      - name: Install Kyverno (from chart dependency)
        run: |
          kyverno_chart="$(ls charts/steer/charts/kyverno-*.tgz | head -n 1)"
          echo "Using Kyverno chart: ${kyverno_chart}"

          helm install kyverno "${kyverno_chart}" \
            -n kyverno \
            --create-namespace \
            --wait \
            --timeout 20m \
            --kube-api-qps 50 \
            --kube-api-burst 100

      - name: Wait for Kyverno CRDs
        run: |
          attempts=60
          while [ "$attempts" -gt 0 ]; do
            if kubectl get crd clusterpolicies.kyverno.io >/dev/null 2>&1; then
              exit 0
            fi
            attempts=$((attempts - 1))
            sleep 2
          done
          echo "Timed out waiting for Kyverno CRDs" >&2
          kubectl get crd | head -n 50 || true
          exit 1

      - name: Wait for Kyverno controllers
        run: |
          kubectl -n kyverno get deploy -o name || true
          kubectl -n kyverno wait --for=condition=available deploy \
            -l app.kubernetes.io/part-of=kyverno \
            --timeout=10m

      - name: Install Steer chart
        run: |
          helm install steer ./charts/steer \
            -n steer \
            --create-namespace \
            --dependency-update \
            --wait \
            --timeout 10m

      - name: Helm test
        run: helm test steer -n steer --timeout 10m --logs

      - name: Debug (on failure)
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get clusterpolicy || true
          kubectl -n steer get all || true
          kubectl -n kyverno get all || true
          kubectl -n kyverno get deploy || true
          for d in $(kubectl -n kyverno get deploy -o name 2>/dev/null | grep -i kyverno || true); do
            echo "--- logs: $d (kyverno namespace) ---"
            kubectl -n kyverno logs "$d" --tail=200 || true
          done
