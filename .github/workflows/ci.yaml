name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Kyverno Helm repo
        run: helm repo add kyverno https://kyverno.github.io/kyverno/

      - name: Helm lint
        run: helm lint charts/steer

      - name: Helm template (default values)
        run: helm template steer charts/steer -n steer

      - name: Helm template (with kyverno enabled)
        run: helm template steer charts/steer -n steer -f examples/values-with-kyverno.yaml

      - name: Helm template (custom values)
        run: helm template steer charts/steer -n steer -f examples/values-custom.yaml

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Package Helm chart
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm dependency build charts/steer || true
          helm package charts/steer -d .deploy

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: .deploy/*.tgz
