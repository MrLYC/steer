name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  helm-lint-template:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Kyverno Helm repo
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build charts/steer

      - name: Helm lint
        run: helm lint charts/steer

      - name: Helm template (default values)
        run: helm template steer charts/steer -n steer --dependency-update

      - name: Helm template (with kyverno enabled)
        run: helm template steer charts/steer -n steer --dependency-update -f examples/values-with-kyverno.yaml

      - name: Helm template (custom values)
        run: helm template steer charts/steer -n steer --dependency-update -f examples/values-custom.yaml

  kind-helm-test:
    name: kind + helm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: steer

      - name: Add Kyverno Helm repo
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update

      - name: Install Kyverno
        run: |
          helm install kyverno kyverno/kyverno \
            -n kyverno \
            --create-namespace \
            --wait \
            --timeout 10m

          kubectl rollout status -n kyverno deploy/kyverno-admission-controller --timeout=10m
          kubectl rollout status -n kyverno deploy/kyverno-background-controller --timeout=10m
          kubectl rollout status -n kyverno deploy/kyverno-cleanup-controller --timeout=10m
          kubectl rollout status -n kyverno deploy/kyverno-reports-controller --timeout=10m

          kubectl get crd clusterpolicies.kyverno.io

      - name: Build chart dependencies
        run: helm dependency build charts/steer

      - name: Install Steer chart
        run: |
          helm install steer ./charts/steer \
            -n steer \
            --create-namespace \
            --dependency-update \
            --wait \
            --timeout 10m

      - name: Helm test
        run: helm test steer -n steer --timeout 10m --logs

      - name: Debug (on failure)
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get clusterpolicy
          kubectl -n steer get all
          kubectl -n kyverno get all
