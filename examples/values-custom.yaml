# 示例：使用外部已安装的 Kyverno，自定义 Steer 配置
# 用法：
#   helm install steer charts/steer -n steer -f examples/values-custom.yaml --create-namespace

# 使用自定义标签选择器来识别受管命名空间
namespaceSelector:
  key: "team.example.com/test-env"
  value: "true"

# 将命名空间 TTL 延长到 4 小时
namespaceTTL: "4h"

cleanupOnTestComplete:
  enabled: true

history:
  enabled: true
  # 将历史记录存放到专用命名空间
  namespace: "steer-history"
  # 保留历史记录 7 天
  ttl: "168h"
  # 记录额外的资源类型
  resources:
    - group: ""
      version: "v1"
      resource: "pods"
      kind: "Pod"
    - group: ""
      version: "v1"
      resource: "services"
      kind: "Service"
    - group: "apps"
      version: "v1"
      resource: "deployments"
      kind: "Deployment"
    - group: "apps"
      version: "v1"
      resource: "statefulsets"
      kind: "StatefulSet"
    - group: "apps"
      version: "v1"
      resource: "daemonsets"
      kind: "DaemonSet"
    - group: "apps"
      version: "v1"
      resource: "replicasets"
      kind: "ReplicaSet"
    - group: "batch"
      version: "v1"
      resource: "jobs"
      kind: "Job"
    - group: "batch"
      version: "v1"
      resource: "cronjobs"
      kind: "CronJob"
    - group: "networking.k8s.io"
      version: "v1"
      resource: "ingresses"
      kind: "Ingress"

# Kyverno 已在集群中独立安装
kyverno:
  enabled: false
