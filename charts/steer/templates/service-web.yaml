{{- if and .Values.web.enabled .Values.web.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "steer.fullname" . }}-web
  labels:
    {{- include "steer.labels" . | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: web
      protocol: TCP
      name: http
  selector:
    {{- include "steer.selectorLabels" . | nindent 4 }}
{{- end }}
