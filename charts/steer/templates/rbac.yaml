{{/*
# ============================================================================
# RBAC: Kyverno Permissions for Steer Policies
# ============================================================================
# Purpose:
#   Grant Kyverno the necessary permissions to:
#   1. Delete Namespaces (for TTL cleanup)
#   2. Read workload resources in namespaces (for history recording)
#   3. Create/update ConfigMaps in the history namespace (for history recording)
#   4. Mutate Namespaces (for cleanup-on-test-complete)
#
# Notes:
#   - These ClusterRoles follow Kyverno's labeling convention so that
#     Kyverno's controllers can aggregate them automatically
#   - The background controller needs permissions for generate and
#     mutate existing rules
# ============================================================================
*/}}
{{- if .Values.rbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "steer.fullname" . }}-kyverno-ns
  labels:
    {{- include "steer.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "steer.fullname" . }}-kyverno-workloads
  labels:
    {{- include "steer.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "steer.fullname" . }}-kyverno-cleanup
  labels:
    {{- include "steer.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "delete"]
{{- end }}
