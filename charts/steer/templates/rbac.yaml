{{/*
# ============================================================================
# RBAC: Kyverno Permissions for Steer Policies
# ============================================================================
# 目的：
#   授予 Kyverno 运行 Steer 策略所需的权限：
#   1. 删除 Namespace（用于 TTL 清理）
#   2. 读取命名空间内工作负载资源（用于历史记录）
#   3. 在历史命名空间创建/更新 ConfigMap（用于历史记录）
#   4. 修改 Namespace（用于“测试完成即清理”）
#
# 说明：
#   - 这些 ClusterRole 遵循 Kyverno 的标签约定，以便 Kyverno 控制器可以自动聚合
#   - background controller 需要 generate / mutate existing 等能力对应的权限
# ============================================================================
*/}}
{{- if .Values.rbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "steer.fullname" . }}-kyverno-ns
  labels:
    {{- include "steer.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "steer.fullname" . }}-kyverno-workloads
  labels:
    {{- include "steer.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "steer.fullname" . }}-kyverno-cleanup
  labels:
    {{- include "steer.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "delete"]
{{- end }}
