apiVersion: v2
name: steer
description: >-
  一个用于 Helm 测试工作流“护栏”的 Helm chart。
  它通过 Kyverno ClusterPolicy 自动化命名空间生命周期管理，
  包括基于 TTL 的清理、测试完成触发的删除，以及测试历史记录。
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - helm-test
  - kyverno
  - namespace-lifecycle
  - cleanup
  - policy
home: https://github.com/steer
sources:
  - https://github.com/steer
maintainers:
  - name: steer
dependencies:
  - name: kyverno
    version: "3.x.x"
    repository: https://kyverno.github.io/kyverno/
    condition: kyverno.enabled
