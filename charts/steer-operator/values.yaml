image:
  repository: docker.io/username/steer-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

leaderElection:
  enabled: true

healthProbe:
  bindAddress: ":8081"

metrics:
  # metrics-bind-address is computed as:
  # - 127.0.0.1:<port> by default
  # - 0.0.0.0:<port> if listenOnAllInterfaces=true
  # - bindAddress if non-empty (overrides both)
  port: 8080
  listenOnAllInterfaces: false
  bindAddress: ""
  secure: false
  enableHTTP2: false
  service:
    enabled: false
    type: ClusterIP
    # If 0, defaults to metrics.port
    port: 0
    annotations: {}

web:
  # Embedded web server is for testing/demo only.
  enabled: false
  addr: ":8082"
  staticDir: "/static"
  service:
    enabled: true
    type: ClusterIP
    port: 80
    annotations: {}
