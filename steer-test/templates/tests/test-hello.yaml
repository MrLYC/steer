apiVersion: v1
kind: Pod
metadata:
  name: {{ include "steer-test.fullname" . }}-test-hello
  labels:
    app.kubernetes.io/name: {{ include "steer-test.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: hello
      image: alpine:3.19
      command: ["/bin/sh", "-c"]
      args:
        - |
          printf 'hello %s\n' {{ .Values.name | quote }}
